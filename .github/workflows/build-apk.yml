name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6.1
  GODOT_MAJOR_MINOR: 4.6
  EXPORT_NAME: tonton-jiee

jobs:
  export-android:
    name: Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container:
      image: barichello/godot-ci:4.6.1
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Godot environment (fix HOME mismatch on GitHub Actions)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable 2>/dev/null || true
          mv /root/.config/godot ~/.config/godot 2>/dev/null || true
          echo "export/android/java_sdk_path = \"/usr/lib/jvm/java-17-openjdk-amd64\"" >> ~/.config/godot/editor_settings-${GODOT_MAJOR_MINOR}.tres

      - name: Regenerate debug keystore
        run: |
          rm -f /root/debug.keystore
          keytool -genkeypair -v \
            -keystore /root/debug.keystore \
            -storetype JKS \
            -alias androiddebugkey \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 9999 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/${EXPORT_NAME}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-apk
          path: build/android/${{ env.EXPORT_NAME }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Tonton Jiee — build #${{ github.run_number }}"
          files: build/android/${{ env.EXPORT_NAME }}.apk
          make_latest: true
